name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with strict warnings
        run: make all

      # GitHub 托管 runner 禁止无特权 user namespace，用 root 创建独立 IPC 命名空间。
      - name: Run regression tests
        run: sudo --preserve-env=PATH python3 tests/verify.py

      - name: Check reports are in sync
        run: python3 reports/generate_reports.py --check
